<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>터틀봇 관제 대시보드</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.0/nipplejs.min.js"></script>
    <script src="predictive_air_quality.js"></script>

    <style>
        :root {
            --bg: #f6f7f5;
            --surface: #fffefa;
            --surface-strong: #ffffff;
            --ink: #202322;
            --muted: #777f7b;
            --line: #e4e8e2;
            --green: #27786b;
            --green-soft: #dcefe9;
            --blue: #4577ff;
            --warning: #d76b48;
            --shadow: 0 18px 40px rgba(42, 51, 46, 0.12);
        }

        * { box-sizing: border-box; }

        [hidden] {
            display: none !important;
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overflow-y: auto;
            background:
                radial-gradient(circle at 18% 0%, rgba(224, 239, 232, 0.9), transparent 34%),
                linear-gradient(180deg, #fbfbf8 0%, var(--bg) 46%, #eef2ef 100%);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0;
        }

        .app_shell {
            width: min(100%, 540px);
            margin: 0 auto;
            min-height: 100vh;
            padding: max(10px, env(safe-area-inset-top)) 12px 10px;
            display: flex;
            flex-direction: column;
        }

        .top_bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 2px 2px 8px;
        }

        .eyebrow {
            margin: 0 0 4px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(22px, 6vw, 30px);
            line-height: 1.08;
            font-weight: 850;
        }

        .status-pill,
        #status_box {
            flex: 0 0 auto;
            min-width: 86px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid rgba(32, 35, 34, 0.08);
            background: #f0eee9;
            color: #675f58;
            font-size: 12px;
            font-weight: 850;
            text-align: center;
        }

        #status_box.connected {
            background: var(--green-soft);
            color: #145b50;
        }

        #status_box.disconnected {
            background: #f8e7df;
            color: #94442b;
        }

        .hero_card,
        .panel {
            border: 1px solid rgba(92, 109, 99, 0.16);
            border-radius: 28px;
            background: rgba(255, 254, 250, 0.92);
            box-shadow: var(--shadow);
        }

        .hero_card {
            position: relative;
            overflow: hidden;
            padding: 12px;
        }

        .hero_card::before {
            content: "";
            position: absolute;
            inset: 18px 18px auto auto;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(39, 120, 107, 0.2), rgba(39, 120, 107, 0.04) 62%, transparent 64%);
            pointer-events: none;
        }

        .air_header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
            position: relative;
        }

        .section_label,
        .metric_label {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
            font-weight: 850;
        }

        .air_quality_text {
            margin-top: 5px;
            font-size: 15px;
            line-height: 1.2;
            font-weight: 850;
        }

        .pm_display {
            display: flex;
            align-items: baseline;
            gap: 7px;
            margin-top: 8px;
        }

        #pm25_value {
            font-size: clamp(38px, 13vw, 56px);
            line-height: 0.9;
            font-weight: 880;
            letter-spacing: 0;
        }

        .metric_unit {
            color: var(--muted);
            font-size: 15px;
            font-weight: 800;
        }

        .air_ring {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: conic-gradient(var(--green) 0 76%, #e6ebe7 76% 100%);
            display: grid;
            place-items: center;
            box-shadow: inset 0 0 0 1px rgba(39, 120, 107, 0.18);
        }

        .air_ring::after {
            content: "";
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--surface);
            box-shadow: inset 0 0 0 1px rgba(92, 109, 99, 0.12);
        }

        .quick_stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .metric {
            min-height: 48px;
            padding: 8px;
            border-radius: 20px;
            border: 1px solid var(--line);
            background: var(--surface-strong);
        }

        .metric_value {
            margin-top: 3px;
            color: var(--ink);
            font-size: 13px;
            line-height: 1.25;
            font-weight: 850;
            word-break: keep-all;
        }

        .panel {
            margin-top: 8px;
            padding: 12px;
        }

        .panel_header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .panel_title {
            margin: 0;
            font-size: 15px;
            font-weight: 850;
        }

        #map {
            width: 100%;
            height: clamp(188px, 28vh, 240px);
            min-height: 188px;
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            background: #202421;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #map_canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #map_status {
            position: absolute;
            left: 12px;
            bottom: 12px;
            max-width: calc(100% - 24px);
            padding: 7px 11px;
            border-radius: 999px;
            background: rgba(255, 254, 250, 0.9);
            color: #27302c;
            font-size: 12px;
            font-weight: 850;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
        }

        .mode_switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 6px;
            border-radius: 999px;
            background: #ecefea;
        }

        .zone_focus_grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .manual_fan_controls {
            grid-template-columns: repeat(2, 1fr);
        }

        .zone_btn {
            min-height: 38px;
            padding: 8px 8px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--surface-strong);
            color: #4e5753;
            font-size: 13px;
            font-weight: 850;
        }

        .zone_btn.active {
            border-color: rgba(39, 120, 107, 0.55);
            background: var(--green-soft);
            color: #145b50;
        }

        .btn {
            width: 100%;
            min-height: 40px;
            padding: 9px 12px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: #6a736f;
            font-size: 15px;
            font-weight: 850;
        }

        .btn.active {
            background: #1f2421;
            color: white;
            box-shadow: 0 10px 22px rgba(32, 35, 34, 0.2);
        }

        .joystick_panel {
            min-height: 0;
            flex: 0 0 auto;
        }

        .predictive_panel {
            display: grid;
            gap: 10px;
        }

        .prediction_topline {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        #prediction_score {
            flex: 0 0 auto;
            min-width: 74px;
            padding: 8px 10px;
            border-radius: 999px;
            background: #1f2421;
            color: #fff;
            font-size: 13px;
            font-weight: 880;
            text-align: center;
        }

        .prediction_reason {
            margin: 0;
            color: #4e5753;
            font-size: 13px;
            line-height: 1.35;
            font-weight: 760;
            word-break: keep-all;
        }

        .prediction_grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .prediction_input {
            width: 100%;
            min-height: 36px;
            margin-top: 4px;
            padding: 7px 9px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--surface-strong);
            color: var(--ink);
            font: inherit;
            font-size: 14px;
            font-weight: 800;
        }

        .zone_marker_label {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #zone_joystick {
            width: 100%;
            height: clamp(132px, 20vh, 170px);
            position: relative;
            touch-action: none;
            overflow: hidden;
            border-radius: 26px;
            background:
                linear-gradient(90deg, transparent calc(50% - 1px), rgba(39, 120, 107, 0.15) calc(50% - 1px), rgba(39, 120, 107, 0.15) calc(50% + 1px), transparent calc(50% + 1px)),
                linear-gradient(0deg, transparent calc(50% - 1px), rgba(39, 120, 107, 0.15) calc(50% - 1px), rgba(39, 120, 107, 0.15) calc(50% + 1px), transparent calc(50% + 1px)),
                #f1f4ef;
            border: 1px solid var(--line);
        }

        #zone_joystick::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 78px;
            height: 78px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(39, 120, 107, 0.18);
            background: rgba(255, 254, 250, 0.42);
            pointer-events: none;
        }


        @media (max-width: 859px) {
            .controls_column > .panel .panel_header,
            .dashboard_grid > .panel .panel_header,
            .joystick_panel .panel_header {
                display: none;
            }

            .controls_column > .panel {
                padding: 9px;
            }

            .mode_switch {
                padding: 4px;
            }

            .btn {
                min-height: 36px;
                padding: 8px 10px;
            }

            #map {
                height: 248px;
                min-height: 248px;
            }

            #zone_joystick {
                height: 128px;
                border-radius: 22px;
            }
        }


        @media (max-height: 760px) {
            .eyebrow, .section_label, .metric_label {
                font-size: 11px;
            }

            h1 {
                font-size: 21px;
            }

            .hero_card, .panel {
                border-radius: 22px;
            }

            .top_bar {
                padding-bottom: 6px;
            }

            #map {
                height: 220px;
                min-height: 220px;
            }

            #zone_joystick {
                height: 112px;
            }
        }

        @media (min-width: 860px) {
            .app_shell {
                width: min(100%, 1040px);
                padding-top: 18px;
            }

            .dashboard_grid {
                display: grid;
                grid-template-columns: 0.9fr 1.1fr;
                gap: 12px;
                align-items: start;
            }

            .panel {
                margin-top: 0;
            }

            .controls_column {
                display: grid;
                gap: 14px;
            }
        }


        body {
            height: 100dvh;
            min-height: 100dvh;
            overflow: hidden;
            background: #eef1f2;
            color: #17201c;
        }

        .app_shell {
            width: min(100%, 1180px);
            height: 100dvh;
            min-height: 0;
            padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
            gap: 8px;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
        }

        .ops_header,
        .command_dock,
        .drawer {
            border: 1px solid #d7dddf;
            background: #fbfcfb;
            box-shadow: 0 10px 26px rgba(25, 35, 32, 0.08);
        }

        .ops_header {
            border-radius: 8px;
            padding: 8px;
            display: grid;
            gap: 8px;
        }

        .ops_title_row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            align-items: center;
        }

        .ops_title {
            margin: 0;
            font-size: 18px;
            line-height: 1.1;
            font-weight: 850;
        }

        .ops_subtitle {
            margin: 2px 0 0;
            color: #60706b;
            font-size: 11px;
            font-weight: 800;
        }

        #status_box,
        #status_box.connected,
        #status_box.disconnected,
        .connected,
        .disconnected {
            min-width: 76px;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 850;
            text-align: center;
        }

        #status_box.connected,
        .connected {
            border: 1px solid #9fcbc0;
            background: #e7f4f1;
            color: #135c51;
        }

        #status_box.disconnected,
        .disconnected {
            border: 1px solid #e7b9a6;
            background: #fff0e9;
            color: #9a4528;
        }

        .status_grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
        }

        .metric_compact {
            min-width: 0;
            min-height: 48px;
            padding: 7px 8px;
            border: 1px solid #dfe5e6;
            border-radius: 6px;
            background: #ffffff;
            display: grid;
            align-content: center;
            gap: 3px;
        }

        .metric_compact.pm {
            grid-template-columns: auto minmax(0, 1fr);
            align-items: center;
            column-gap: 8px;
        }

        .compact_label {
            color: #697773;
            font-size: 10px;
            font-weight: 850;
        }

        .compact_value {
            min-width: 0;
            color: #17201c;
            font-size: 13px;
            line-height: 1.15;
            font-weight: 850;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pm_value_line {
            display: flex;
            align-items: baseline;
            gap: 3px;
        }

        #pm25_value {
            font-size: 25px;
            line-height: 0.95;
            font-weight: 900;
        }

        .metric_unit {
            font-size: 10px;
            font-weight: 850;
        }

        .air_ring {
            width: 30px;
            height: 30px;
        }

        .air_ring::after {
            width: 18px;
            height: 18px;
        }

        .map_panel {
            min-height: 0;
            border: 1px solid #cbd2d5;
            border-radius: 8px;
            overflow: hidden;
            background: #151a18;
        }

        #map {
            width: 100%;
            height: 100%;
            min-height: 0;
            border-radius: 0;
            background: #151a18;
        }

        .map_overlay {
            position: absolute;
            left: 8px;
            top: 8px;
            right: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            pointer-events: none;
        }

        .status_chip {
            max-width: 100%;
            padding: 6px 8px;
            border-radius: 6px;
            background: rgba(251, 252, 251, 0.92);
            color: #17201c;
            font-size: 11px;
            font-weight: 850;
            line-height: 1.1;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
        }

        #map_status {
            left: 8px;
            bottom: 8px;
            border-radius: 6px;
        }

        .command_dock {
            border-radius: 8px;
            padding: 8px;
            display: grid;
            gap: 7px;
        }

        .mode_switch {
            padding: 3px;
            border-radius: 7px;
            background: #e3e8e8;
        }

        .btn {
            min-height: 38px;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn.active {
            background: #17201c;
            color: #ffffff;
            box-shadow: none;
        }

        .zone_focus_grid {
            margin-top: 0;
            gap: 6px;
        }

        .zone_btn {
            min-height: 38px;
            border-radius: 6px;
            font-size: 12px;
            background: #ffffff;
        }

        .zone_btn.active {
            border-color: #5fa99c;
            background: #e5f4f0;
            color: #145b50;
        }

        .utility_row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .utility_row.single_action {
            grid-template-columns: 1fr;
        }

        .utility_btn {
            min-height: 36px;
            border: 1px solid #cfd7d9;
            border-radius: 6px;
            background: #f7f9f9;
            color: #25302c;
            font-size: 12px;
            font-weight: 850;
        }

        .utility_btn.active {
            border-color: #4a7cff;
            background: #edf2ff;
            color: #244ca8;
        }

        .drawer {
            position: static;
            width: 100%;
            margin-top: 8px;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #d7dede;
            background: #ffffff;
        }

        .drawer[hidden] {
            display: none;
        }

        .drawer_header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .drawer_title {
            margin: 0;
            font-size: 13px;
            font-weight: 850;
        }

        #zone_joystick {
            height: 154px;
            border-radius: 6px;
        }

        #prediction_score {
            min-width: 0;
            padding: 0;
            border-radius: 0;
            background: transparent;
            color: #17201c;
            text-align: left;
            font-size: 13px;
        }

        .prediction_reason {
            font-size: 12px;
            line-height: 1.3;
        }

        .prediction_input {
            min-height: 30px;
            margin-top: 3px;
            border-radius: 5px;
            font-size: 13px;
        }

        @media (min-width: 760px) {
            .app_shell {
                width: min(100%, 1080px);
                padding: 12px;
                display: grid;
                grid-template-columns: 300px minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr);
            }

            .ops_header {
                grid-column: 1 / -1;
            }

            .status_grid {
                grid-template-columns: 0.9fr 0.8fr 1.15fr 0.9fr;
            }

            .map_panel {
                grid-column: 2;
                grid-row: 2;
            }

            .command_dock {
                grid-column: 1;
                grid-row: 2;
                align-self: start;
                display: grid;
                gap: 8px;
            }

            .command_dock .zone_focus_grid,
            .command_dock .drawer {
                margin-top: 0;
            }

        }

    </style>
</head>
<body>
    <main class="app_shell">
        <header class="ops_header">
            <div class="ops_title_row">
                <div>
                    <h1 class="ops_title">정화 로봇 관제</h1>
                    <p class="ops_subtitle">자동 정화주행 · 구역 집중 순찰</p>
                </div>
                <div id="status_box" class="disconnected">연결 대기</div>
            </div>
            <section class="status_grid" aria-label="실시간 상태">
                <div class="metric_compact pm">
                    <div id="air_ring" class="air_ring" aria-hidden="true"></div>
                    <div>
                        <div class="compact_label">PM2.5</div>
                        <div class="pm_value_line">
                            <span id="pm25_value">--</span>
                            <span class="metric_unit">ug/m3</span>
                        </div>
                    </div>
                </div>
                <div class="metric_compact">
                    <div class="compact_label">운전 모드</div>
                    <div id="mode_value" class="compact_value">수동 제어</div>
                </div>
                <div class="metric_compact">
                    <div class="compact_label">로봇 위치</div>
                    <div class="compact_value"><span id="pose_value">대기</span></div>
                </div>
                <div class="metric_compact">
                    <div class="compact_label">외부 PM2.5</div>
                    <div id="outdoor_pm25_value" class="compact_value">대기</div>
                    <div id="outdoor_pm25_status" class="compact_label">API 대기</div>
                </div>
            </section>
        </header>

        <section class="map_panel" aria-label="주행 지도">
            <div id="map">
                <canvas id="map_canvas"></canvas>
                <div class="map_overlay">
                    <div id="air_quality_label" class="status_chip">센서 대기 중</div>
                    <div id="target_zone_label" class="status_chip">선택: 전체</div>
                </div>
                <div id="map_status">맵 대기</div>
            </div>
        </section>

        <section class="command_dock" aria-label="운전 명령">
            <div class="mode_switch">
                <button id="btn_manual" class="btn active" onclick="setMode('manual')">수동</button>
                <button id="btn_auto" class="btn" onclick="setMode('auto')">자동</button>
            </div>
            <div id="auto_controls" class="zone_focus_grid" hidden>
                <button id="zone_all" class="zone_btn active" onclick="setTargetZone('all')">전체</button>
                <button id="zone_kitchen" class="zone_btn" onclick="setTargetZone('kitchen')">주방 집중</button>
            </div>
            <div id="manual_fan_controls" class="zone_focus_grid manual_fan_controls">
                <button id="btn_fan_on" class="zone_btn" onclick="setManualFan(true)">팬 ON</button>
                <button id="btn_fan_off" class="zone_btn active" onclick="setManualFan(false)">팬 OFF</button>
            </div>
            <section id="joystick_drawer" class="drawer" hidden>
                <div class="drawer_header">
                    <h2 class="drawer_title">수동 조이스틱</h2>
                    <button class="utility_btn" onclick="toggleJoystick(false)">닫기</button>
                </div>
                <div id="zone_joystick"></div>
            </section>
        </section>

    </main>

    <script>
        // 현재 브라우저가 접속한 IP(노트북 IP)를 자동으로 가져와서 9090 포트에 연결
        var ros = new ROSLIB.Ros();
        var mapTopic = null;
        var poseTopic = null;
        var pmTopic = null;
        var outdoorPm25Topic = null;
        var adaptiveThresholdTopic = null;
        var outdoorPm25FromRos = null;
        var outdoorPm25UpdatedAt = 0;
        var adaptiveThreshold = 50;
        var mapStarted = false;
        var rosConnected = false;
        var lastMapMsg = null;
        var lastPose = null;
        var mapDrawState = null;
        var currentPm25 = null;
        var purifierStatusOverride = null;
        var purifierStatusUntil = 0;
        var MAP_VIEW_SCALE = 1.18;
        var MAP_DOT_RADIUS_PX = 9;
        var patrolWaypoints = [
            { id: 'wp_1', label: '순찰 1', type: 'corridor', x: 3.07, y: 4.98, yaw: -1.59, distance: 1.0, recentVisitMinutes: 60, lastPm25: null },
            { id: 'wp_2', label: '순찰 2', type: 'entry', x: 5.18, y: 1.62, yaw: 0.05, distance: 1.4, recentVisitMinutes: 60, lastPm25: null },
            { id: 'wp_3', label: '순찰 3', type: 'window', x: 8.00, y: 1.40, yaw: 1.47, distance: 1.8, recentVisitMinutes: 60, lastPm25: null },
            { id: 'kitchen', label: '주방', type: 'kitchen', x: 7.50, y: 5.19, yaw: -2.90, distance: 1.2, recentVisitMinutes: 90, lastPm25: null },
            { id: 'wp_5', label: '순찰 5', type: 'corridor', x: 5.42, y: 4.68, yaw: 3.01, distance: 0.8, recentVisitMinutes: 60, lastPm25: null }
        ];
        var latestPrediction = [];
        var kitchenBounds = { minX: 6.61, maxX: 8.33, minY: 1.40, maxY: 6.05, label: '주방' };

        ros.on('connection', () => { 
            rosConnected = true;
            document.getElementById('status_box').innerText = '연결됨'; 
            document.getElementById('status_box').className = 'connected';
            initMap();
        });

        ros.on('error', () => {
            rosConnected = false;
            document.getElementById('status_box').innerText = '연결 에러';
            document.getElementById('status_box').className = 'disconnected';
            document.getElementById('map_status').innerText = 'ROS 연결 에러';
        });

        ros.on('close', () => {
            rosConnected = false;
            mapStarted = false;
            mapTopic = null;
            document.getElementById('status_box').innerText = '연결 끊김';
            document.getElementById('status_box').className = 'disconnected';
            document.getElementById('map_status').innerText = '재연결 대기';
            setTimeout(connectRos, 1000);
        });

        function connectRos() {
            if (rosConnected) return;
            ros.connect('ws://' + window.location.hostname + ':9090');
        }

        function initMap() {
            if (mapStarted) return;
            mapStarted = true;

            mapTopic = new ROSLIB.Topic({
                ros: ros,
                name: '/map_web',
                messageType: 'nav_msgs/OccupancyGrid'
            });

            document.getElementById('map_status').innerText = '/map_web 구독 중';
            mapTopic.subscribe(drawOccupancyGrid);

            poseTopic = new ROSLIB.Topic({
                ros: ros,
                name: '/robot_pose_web',
                messageType: 'geometry_msgs/PoseStamped'
            });
            poseTopic.subscribe(function(msg) {
                lastPose = msg.pose;
                lastPose.frame_id = msg.header.frame_id;
                updatePoseLabel(lastPose);
                redrawMap();
            });

            pmTopic = new ROSLIB.Topic({
                ros: ros,
                name: '/pms7003/pm25',
                messageType: 'std_msgs/Int32'
            });
            pmTopic.subscribe(function(msg) {
                updatePmUi(msg.data);
            });

            outdoorPm25Topic = new ROSLIB.Topic({
                ros: ros,
                name: '/air_quality/outdoor_pm25',
                messageType: 'std_msgs/Int32'
            });
            outdoorPm25Topic.subscribe(function(msg) {
                outdoorPm25FromRos = Number(msg.data);
                outdoorPm25UpdatedAt = Date.now();
                updateOutdoorPm25Ui(msg.data);
                updatePredictiveCare();
            });

            adaptiveThresholdTopic = new ROSLIB.Topic({
                ros: ros,
                name: '/air_quality/adaptive_threshold',
                messageType: 'std_msgs/Int32'
            });
            adaptiveThresholdTopic.subscribe(function(msg) {
                adaptiveThreshold = Number(msg.data);
                updatePredictiveCare();
            });

            purifierStatusTopic = new ROSLIB.Topic({
                ros: ros,
                name: '/purifier_status',
                messageType: 'std_msgs/String'
            });
            purifierStatusTopic.subscribe(function(msg) {
                setPurifierStatus(msg.data);
            });
        }

        connectRos();

        function drawOccupancyGrid(msg) {
            lastMapMsg = msg;
            redrawMap();
        }

        function redrawMap() {
            if (!lastMapMsg) return;
            var msg = lastMapMsg;
            var width = msg.info.width;
            var height = msg.info.height;
            var canvas = document.getElementById('map_canvas');
            var status = document.getElementById('map_status');
            var ctx = canvas.getContext('2d');

            var rect = canvas.getBoundingClientRect();
            var deviceRatio = window.devicePixelRatio || 1;
            var targetWidth = Math.max(1, Math.floor(rect.width * deviceRatio));
            var targetHeight = Math.max(1, Math.floor(rect.height * deviceRatio));

            if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
                canvas.width = targetWidth;
                canvas.height = targetHeight;
            }

            var offscreen = document.createElement('canvas');
            offscreen.width = width;
            offscreen.height = height;
            var offCtx = offscreen.getContext('2d');
            var image = offCtx.createImageData(width, height);

            for (var y = 0; y < height; y++) {
                for (var x = 0; x < width; x++) {
                    var srcIndex = (height - 1 - y) * width + x;
                    var dstIndex = (y * width + x) * 4;
                    var value = msg.data[srcIndex];
                    var color = 205;

                    if (value === -1) {
                        color = 132;
                    } else if (value >= 65) {
                        color = 22;
                    } else if (value <= 25) {
                        color = 245;
                    }

                    image.data[dstIndex] = color;
                    image.data[dstIndex + 1] = color;
                    image.data[dstIndex + 2] = color;
                    image.data[dstIndex + 3] = 255;
                }
            }

            offCtx.putImageData(image, 0, 0);

            ctx.fillStyle = '#1c1c1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            var fitScale = Math.min(canvas.width / width, canvas.height / height);
            var scale = fitScale * MAP_VIEW_SCALE;
            var drawWidth = width * scale;
            var drawHeight = height * scale;
            var dx = (canvas.width - drawWidth) / 2;
            var dy = (canvas.height - drawHeight) / 2;
            mapDrawState = { dx: dx, dy: dy, scale: scale, width: width, height: height, info: msg.info };

            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(offscreen, dx, dy, drawWidth, drawHeight);
            drawKitchenBounds(ctx);
            drawPredictiveZoneHints(ctx);
            drawRobotPose(ctx);
            status.innerText = '맵 수신 ' + width + 'x' + height;
        }

        function worldToCanvas(x, y) {
            if (!mapDrawState) return null;
            var info = mapDrawState.info;
            var mapX = (x - info.origin.position.x) / info.resolution;
            var mapY = (y - info.origin.position.y) / info.resolution;
            return {
                x: mapDrawState.dx + mapX * mapDrawState.scale,
                y: mapDrawState.dy + (mapDrawState.height - mapY) * mapDrawState.scale
            };
        }

        function drawKitchenBounds(ctx) {
            if (!mapDrawState || !kitchenBounds) return;

            var a = worldToCanvas(kitchenBounds.minX, kitchenBounds.minY);
            var b = worldToCanvas(kitchenBounds.maxX, kitchenBounds.maxY);
            if (!a || !b) return;

            var left = Math.min(a.x, b.x);
            var top = Math.min(a.y, b.y);
            var width = Math.abs(b.x - a.x);
            var height = Math.abs(b.y - a.y);
            var pixelRatio = window.devicePixelRatio || 1;

            ctx.save();
            ctx.fillStyle = 'rgba(215, 107, 72, 0.20)';
            ctx.strokeStyle = '#ff8a5c';
            ctx.lineWidth = Math.max(2, 2 * pixelRatio);
            ctx.setLineDash([6 * pixelRatio, 4 * pixelRatio]);
            ctx.fillRect(left, top, width, height);
            ctx.strokeRect(left, top, width, height);
            ctx.setLineDash([]);

            ctx.font = (12 * pixelRatio) + 'px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            var label = kitchenBounds.label;
            var paddingX = 6 * pixelRatio;
            var paddingY = 4 * pixelRatio;
            var textWidth = ctx.measureText(label).width;
            var labelX = left + 6 * pixelRatio;
            var labelY = top + 6 * pixelRatio;
            ctx.fillStyle = 'rgba(23, 32, 28, 0.82)';
            ctx.fillRect(labelX - paddingX, labelY - paddingY, textWidth + paddingX * 2, 18 * pixelRatio);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(label, labelX, labelY);
            ctx.restore();
        }

        function drawPredictiveZoneHints(ctx) {
            if (!mapDrawState || latestPrediction.length === 0) return;

            var pixelRatio = window.devicePixelRatio || 1;
            latestPrediction.slice(0, 5).forEach(function(zone, index) {
                var point = worldToCanvas(zone.x, zone.y);
                if (!point) return;
                var canvasX = point.x;
                var canvasY = point.y;
                var radius = Math.max(8, MAP_DOT_RADIUS_PX * pixelRatio);
                var color = '#4577ff';

                ctx.save();
                ctx.beginPath();
                ctx.arc(canvasX, canvasY, radius, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.globalAlpha = index === 0 ? 0.92 : 0.7;
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = (index === 0 ? 3 : 2) * pixelRatio;
                ctx.stroke();
                ctx.restore();
            });
        }

        function drawRobotPose(ctx) {
            if (!lastPose || !mapDrawState) return;
            if (lastPose.frame_id !== 'map') return;

            var info = mapDrawState.info;
            var mapX = (lastPose.position.x - info.origin.position.x) / info.resolution;
            var mapY = (lastPose.position.y - info.origin.position.y) / info.resolution;
            var canvasX = mapDrawState.dx + mapX * mapDrawState.scale;
            var canvasY = mapDrawState.dy + (mapDrawState.height - mapY) * mapDrawState.scale;
            var yaw = quaternionToYaw(lastPose.orientation);
            var pixelRatio = window.devicePixelRatio || 1;
            var radius = Math.max(8, 7 * pixelRatio);

            ctx.save();
            ctx.translate(canvasX, canvasY);
            ctx.rotate(-yaw);
            ctx.fillStyle = '#27786b';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3 * pixelRatio;

            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(radius + 4, 0);
            ctx.lineTo(-radius * 0.35, -radius * 0.55);
            ctx.lineTo(-radius * 0.35, radius * 0.55);
            ctx.closePath();
            ctx.fillStyle = '#4577ff';
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function quaternionToYaw(q) {
            var siny = 2.0 * (q.w * q.z + q.x * q.y);
            var cosy = 1.0 - 2.0 * (q.y * q.y + q.z * q.z);
            return Math.atan2(siny, cosy);
        }

        function updatePoseLabel(pose) {
            var frame = pose.frame_id ? ' (' + pose.frame_id + ')' : '';
            document.getElementById('pose_value').innerText =
                'x ' + pose.position.x.toFixed(2) + ', y ' + pose.position.y.toFixed(2) + frame;
        }

        // --- 조이스틱 및 모드 제어 ---
        var cmdVel = new ROSLIB.Topic({ ros: ros, name: '/cmd_vel', messageType: 'geometry_msgs/TwistStamped' });
        var modeTopic = new ROSLIB.Topic({ ros: ros, name: '/robot_mode', messageType: 'std_msgs/String' });
        var targetZoneTopic = new ROSLIB.Topic({ ros: ros, name: '/target_zone', messageType: 'std_msgs/String' });
        var fanRelayTopic = new ROSLIB.Topic({ ros: ros, name: '/hardware/relay', messageType: 'std_msgs/Bool' });
        var currentTargetZone = 'all';

        function setMode(mode) {
            document.getElementById('btn_manual').className = (mode === 'manual') ? 'btn active' : 'btn';
            document.getElementById('btn_auto').className = (mode === 'auto') ? 'btn active' : 'btn';
            document.getElementById('mode_value').innerText = (mode === 'manual') ? '수동 제어' : '자동 정화';
            setControlPanelForMode(mode);
            if (mode === 'manual') openJoystick();
            if (mode === 'auto') closeJoystick();
            modeTopic.publish(new ROSLIB.Message({ data: mode }));
        }

        function setControlPanelForMode(mode) {
            var manualControls = document.getElementById('manual_fan_controls');
            var autoControls = document.getElementById('auto_controls');
            if (manualControls) manualControls.hidden = mode !== 'manual';
            if (autoControls) autoControls.hidden = mode !== 'auto';
        }

        function setManualFan(enabled) {
            var onButton = document.getElementById('btn_fan_on');
            var offButton = document.getElementById('btn_fan_off');
            if (onButton) onButton.className = enabled ? 'zone_btn active' : 'zone_btn';
            if (offButton) offButton.className = enabled ? 'zone_btn' : 'zone_btn active';
            fanRelayTopic.publish(new ROSLIB.Message({ data: Boolean(enabled) }));
        }

        function targetZoneText(zone) {
            if (zone === 'kitchen') return '선택: 주방 집중';
            return '선택: 전체 순찰';
        }

        function updateTargetZoneLabel(zone) {
            var text = targetZoneText(zone);
            var label = document.getElementById('target_zone_label');
            if (label) label.innerText = text;
        }

        function setTargetZone(zone) {
            currentTargetZone = zone;
            ['all', 'kitchen'].forEach(function(id) {
                var button = document.getElementById('zone_' + id);
                if (button) button.className = id === zone ? 'zone_btn active' : 'zone_btn';
            });
            updateTargetZoneLabel(zone);
            targetZoneTopic.publish(new ROSLIB.Message({ data: zone }));
            setMode('auto');
        }


        function setDrawerState(drawerId, buttonId, open) {
            var drawer = document.getElementById(drawerId);
            var button = buttonId ? document.getElementById(buttonId) : null;
            if (!drawer) return;
            drawer.hidden = !open;
            if (button) button.className = open ? 'utility_btn active' : 'utility_btn';
        }

        function openJoystick() {
            setDrawerState('joystick_drawer', null, true);
            initJoystick();
        }

        function closeJoystick() {
            var drawer = document.getElementById('joystick_drawer');
            var wasOpen = drawer && !drawer.hidden;
            setDrawerState('joystick_drawer', null, false);
            if (wasOpen) publishStopCommand();
        }

        function toggleJoystick(forceOpen) {
            if (forceOpen === false) closeJoystick();
            else openJoystick();
        }

        function updateOutdoorPm25Ui(value) {
            var outdoorValue = Number(value);
            var valueEl = document.getElementById('outdoor_pm25_value');
            var statusEl = document.getElementById('outdoor_pm25_status');
            if (valueEl) {
                valueEl.innerText = Number.isFinite(outdoorValue) ? outdoorValue + ' ug/m3' : '수신 오류';
            }
            if (statusEl) {
                statusEl.innerText = Number.isFinite(outdoorValue) ? '방금 갱신' : 'API 확인 필요';
            }
        }

        function updatePmUi(value) {
            var pmValue = Number(value);
            currentPm25 = Number.isFinite(pmValue) ? pmValue : null;
            document.getElementById('pm25_value').innerText = value;

            var label = document.getElementById('air_quality_label');
            var ring = document.getElementById('air_ring');
            var color = '#27786b';
            var percent = 76;

            if (pmValue > 75) {
                label.innerText = '정화 필요';
                color = '#d76b48';
                percent = 94;
            } else if (pmValue > 35) {
                label.innerText = '주의 상태';
                color = '#b8872e';
                percent = 64;
            } else {
                label.innerText = '쾌적한 상태';
                percent = 38;
            }

            if (purifierStatusOverride && Date.now() < purifierStatusUntil) {
                label.innerText = purifierStatusOverride;
                color = '#27786b';
                percent = purifierStatusOverride === '정화 중' ? 82 : 38;
            }

            ring.style.background = 'conic-gradient(' + color + ' 0 ' + percent + '%, #e6ebe7 ' + percent + '% 100%)';
            updatePredictiveCare();
        }

        function setPurifierStatus(status) {
            if (status === 'purifying') {
                purifierStatusOverride = '정화 중';
                purifierStatusUntil = Date.now() + 8000;
            } else if (status === 'cleaned') {
                purifierStatusOverride = '정화 완료';
                purifierStatusUntil = Date.now() + 12000;
            } else if (status === 'returning') {
                purifierStatusOverride = '복귀 중';
                purifierStatusUntil = Date.now() + 30000;
            } else if (status === 'returned') {
                purifierStatusOverride = '출발지 복귀 완료';
                purifierStatusUntil = Date.now() + 12000;
            } else {
                purifierStatusOverride = null;
                purifierStatusUntil = 0;
            }
            if (currentPm25 !== null) updatePmUi(currentPm25);
        }

        function updatePredictiveCare() {
            if (!window.PredictiveAirQuality) return;

            var hour = new Date().getHours();
            var outdoorPm25 = outdoorPm25FromRos == null ? 0 : Number(outdoorPm25FromRos);
            var thresholdValue = Number.isFinite(adaptiveThreshold)
                ? adaptiveThreshold
                : window.PredictiveAirQuality.calculateAdaptiveThreshold(outdoorPm25);

            var pmForPrediction = currentPm25 == null ? 0 : currentPm25;
            var zones = patrolWaypoints.map(function(zone) {
                var distanceToRobot = lastPose && lastPose.position
                    ? Math.hypot(zone.x - lastPose.position.x, zone.y - lastPose.position.y)
                    : zone.distance;
                var measuredBoost = zone.type === 'kitchen' || zone.type === 'bathroom' ? pmForPrediction : Math.round(pmForPrediction * 0.7);
                return Object.assign({}, zone, {
                    distance: Number.isFinite(distanceToRobot) ? distanceToRobot : zone.distance,
                    lastPm25: currentPm25 == null ? zone.lastPm25 : Math.max(zone.lastPm25 || 0, measuredBoost)
                });
            });

            latestPrediction = window.PredictiveAirQuality.rankPredictiveZones(zones, {
                hour: hour,
                currentPm25: pmForPrediction,
                outdoorPm25: Number.isFinite(outdoorPm25) ? outdoorPm25 : 0
            });

            var top = latestPrediction[0];
            if (!top) return;

            redrawMap();
        }

        updateTargetZoneLabel(currentTargetZone);
        updatePredictiveCare();

        var joystick = null;

        function publishStopCommand() {
            cmdVel.publish(new ROSLIB.Message({ header: { frame_id: '' }, twist: { linear: {x:0, y:0, z:0}, angular: {x:0, y:0, z:0} } }));
        }

        function initJoystick() {
            if (joystick) return;
            var zone = document.getElementById('zone_joystick');
            if (!zone || !window.nipplejs) return;
            joystick = nipplejs.create({
                zone: zone,
                mode: 'static',
                position: {left: '50%', top: '50%'},
                color: '#27786b',
                size: 92
            });

            joystick.on('move', (evt, data) => {
                var linear = Math.sin(data.angle.radian) * 0.22 * (data.distance / 65);
                var angular = -Math.cos(data.angle.radian) * 1.2 * (data.distance / 65);
                cmdVel.publish(new ROSLIB.Message({ header: { frame_id: '' }, twist: { linear: {x: linear, y:0, z:0}, angular: {x:0, y:0, z:angular} } }));
            });

            joystick.on('end', publishStopCommand);
        }
    </script>
</body>
